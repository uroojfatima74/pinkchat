name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Native Files
        run: flutter create . --platforms=android

      - name: Configure Android minSdkVersion
        run: |
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.targetSdkVersion=33" >> android/local.properties

          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion.*/minSdkVersion 21/g' android/app/build.gradle
            sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle
          fi

          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk =.*/minSdk = 21/g' android/app/build.gradle.kts
            sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle.kts
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
